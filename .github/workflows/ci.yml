name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to a new image without notice
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Tests (offline, Groq is faked)
        run: pytest -q --timeout=120
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r constraints.txt
      - name: Static security scan
        run: bandit -q -r voice_to_doc
